plugins {
    id 'com.android.application'
}

// Signing values are injected by the GitHub Actions workflow (see .github/workflows/android-build.yml).
def keystorePath = System.getenv('KEYSTORE_PATH')

android {
    namespace = 'pro.justservices.fixit'
    compileSdk = 36

    defaultConfig {
        applicationId = 'pro.justservices.fixit'
        minSdk = 24
        targetSdk = 36
        versionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
        versionName = (project.findProperty('versionName') ?: '1.0.0').toString()
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile = file(keystorePath)
                storePassword = System.getenv('KEYSTORE_PASSWORD')
                keyAlias = System.getenv('KEY_ALIAS')
                keyPassword = System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (keystorePath) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}
