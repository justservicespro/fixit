name: Android build (APK + AAB)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      create_release:
        description: 'Also publish the files as a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already has the Android SDK; just accept licenses and make sure SDK 36 is present.
      - name: Accept licenses and install SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # ---- Always: debug APK (installs on any phone, needs no secrets) ----
      - name: Build debug APK
        run: >
          gradle -p android assembleDebug --no-daemon --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=${{ github.event.inputs.version_name }}

      # ---- Signing (only when the keystore secret exists) ----
      - name: Prepare signing key
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: building the debug APK only (no AAB)."
          fi

      # ---- Release APK (phone install) + AAB (Google Play) ----
      - name: Build signed release APK and AAB
        if: steps.sign.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          gradle -p android assembleRelease bundleRelease --no-daemon --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=${{ github.event.inputs.version_name }}

      - name: Collect files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/*.apk dist/fixit-abuja-debug.apk
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/*.apk dist/fixit-abuja-release.apk
            cp android/app/build/outputs/bundle/release/*.aab dist/fixit-abuja-release.aab
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: fixit-abuja-android-b${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.event.inputs.version_name }}-b${{ github.run_number }}
          name: FixIT Abuja Android ${{ github.event.inputs.version_name }} (build ${{ github.run_number }})
          files: dist/*
